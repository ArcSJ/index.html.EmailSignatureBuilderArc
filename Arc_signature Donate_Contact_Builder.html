<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arc of the St. Johns Signature Builder</title><style>body{background:#f4f6f8;color:#203349;font:14px Arial,sans-serif;margin:0;padding:24px}.wrap{max-width:850px;margin:auto}.panel{background:white;padding:22px;border:1px solid #dce2e8;border-radius:10px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}label{font-weight:bold;font-size:12px}input{display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #bbc6d0;border-radius:5px}button{background:#e95b19;border:0;border-radius:5px;color:white;font-weight:bold;padding:11px 15px;cursor:pointer;margin:12px 8px 0 0}.secondary{background:#29465c}#preview{overflow:auto;padding:15px 0}#status{color:#265c40}h1{font-size:24px}h2{font-size:18px}</style></head><body><div class="wrap"><h1>The Arc of the St. Johns</h1><p>Coastal email signature builder · 650 px wide · Editable employee information</p><section class="panel"><h2>Employee details</h2><form id="form" class="fields"><label>Full name *<input id="name" required value="Anna Machiz-Dillon"></label><label>Title *<input id="title" required value="Director, Advocacy &amp; Community Affairs"></label><label>Email *<input id="email" type="email" required placeholder="name@arcsj.org"></label><label>Office phone *<input id="office" required value="904.824.7249"></label><label>Extension (optional)<input id="ext" value="121"></label><label>Cell (optional)<input id="cell" value="443.992.3330"></label><label>Fax (optional)<input id="fax" value="904.824.8063"></label><label>Street address<input id="street" value="2101 Arc Dr."></label><label>City, state ZIP<input id="city" value="St. Augustine, FL 32084"></label><label>Website<input id="website" value="www.arcsj.org"></label></form><p><small>* Required. The original logo and coastal artwork are loaded from your Constant Contact links. Buttons are clickable in the finished signature.</small></p></section><section class="panel"><h2>Live preview</h2><div id="preview"></div><button id="copy" type="button">Copy signature</button><button id="download" class="secondary" type="button">Download employee HTML</button><p id="status" role="status"></p></section></div><script>
const LOGO='https://files.constantcontact.com/339e1e0f201/10bb9436-fdb7-4407-9d4b-23c28568a2de.png',COAST='https://files.constantcontact.com/339e1e0f201/3d730115-c55a-4ecc-be2c-3b8018d7e77f.png',DONATE='https://www.paypal.com/donate/?hosted_button_id=Q8F4QANG46RRL',JOIN='https://lp.constantcontactpages.com/sl/dNZaVsY';
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tel=s=>s.replace(/[^+0-9]/g,'');
function contact(label,value,href){if(!value)return '';return `<tr><td style="color:#e65a19;font:bold 12px Arial,sans-serif;padding:2px 5px 2px 0;vertical-align:top">${label}</td><td style="font:12px/1.25 Arial,sans-serif;padding:2px 0;color:#263b50">${href?`<a href="${esc(href)}" style="color:#263b50;text-decoration:none">${esc(value)}</a>`:esc(value)}</td></tr>`}
function signature(){let name=v('name'),title=v('title'),email=v('email'),office=v('office'),ext=v('ext'),cell=v('cell'),fax=v('fax'),street=v('street'),city=v('city'),web=v('website');let address=[street,city].filter(Boolean).map(esc).join('<br>');let contacts=contact('T',office+(ext?' ext. '+ext:''),'tel:'+tel(office))+contact('F',fax,fax?'tel:'+tel(fax):'')+contact('C',cell,cell?'tel:'+tel(cell):'')+contact('@',email,email?'mailto:'+email:'')+contact('W',web,web?'https://'+web.replace(/^https?:\/\//,''):'');return `<table role="presentation" width="650" cellpadding="0" cellspacing="0" border="0" style="width:650px;max-width:650px;border-collapse:collapse;background:#fff;color:#263b50;font-family:Arial,sans-serif"><tr><td width="174" style="width:174px;padding:8px 7px 8px 0;border-right:2px solid #f4af2b;vertical-align:middle"><img src="${LOGO}" alt="The Arc of the St. Johns" width="165" style="width:165px;height:auto;display:block;border:0"></td><td width="250" style="width:250px;padding:8px 3px 5px 11px;vertical-align:top"><div style="font:700 20px/1.17 Poppins,Arial,sans-serif;color:#e65a19">${esc(name)}</div><div style="font:600 12px/1.25 Poppins,Arial,sans-serif;color:#263b50;margin:4px 0 6px">${esc(title)}</div>${address?`<div style="font:12px/1.3 Arial,sans-serif;margin-bottom:5px">${address}</div>`:''}<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse">${contacts}</table></td><td width="226" style="width:226px;padding:0;vertical-align:bottom"><img src="${COAST}" alt="" width="226" style="display:block;width:226px;height:auto;border:0"></td></tr><tr><td colspan="3" style="padding:8px 0 6px;text-align:center;border-bottom:1px solid #e65a19;font:italic 10px Georgia,serif;letter-spacing:.5px;color:#cb551e">FOR PEOPLE WITH INTELLECTUAL AND DEVELOPMENTAL DISABILITIES</td></tr><tr><td colspan="3" style="padding:12px 0 2px"><table role="presentation" width="650" cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:650px"><tr><td width="325" style="width:325px;text-align:center;padding:0 5px 0 0"><a href="${DONATE}" target="_blank" style="display:inline-block;box-sizing:border-box;width:300px;padding:10px 12px;border-radius:5px;background:#e65a19;color:#ffffff;text-decoration:none;font:700 13px/1.3 Poppins,Arial,sans-serif;text-align:center">♥ &nbsp; Make an Impact · Donate</a></td><td width="325" style="width:325px;text-align:center;padding:0 0 0 5px"><a href="${JOIN}" target="_blank" style="display:inline-block;box-sizing:border-box;width:300px;padding:9px 11px;border:1px solid #e65a19;border-radius:5px;background:#fffaf5;color:#b94a17;text-decoration:none;font:700 13px/1.3 Poppins,Arial,sans-serif;text-align:center">✉ &nbsp; Join Our Contact List</a></td></tr></table></td></tr></table>`}
function render(){$('preview').innerHTML=signature();$('status').textContent=''}
function validate(){if(!$('form').reportValidity()){$('status').textContent='Please complete the required fields, including a valid email.';return false}return true}
$('form').addEventListener('input',render);
$('copy').addEventListener('click',async()=>{if(!validate())return;const markup=signature();try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([markup],{type:'text/html'}),'text/plain':new Blob([$('preview').innerText],{type:'text/plain'})})]);$('status').textContent='Copied! Paste into your email signature settings.'}catch(e){const range=document.createRange();range.selectNodeContents($('preview'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('status').textContent='Select and copy the highlighted signature with Ctrl+C or Command+C.'}});
$('download').addEventListener('click',()=>{if(!validate())return;let doc='<!doctype html><html><head><meta charset="utf-8"></head><body>'+signature()+'</body></html>';let url=URL.createObjectURL(new Blob([doc],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='Arc_Signature_'+v('name').replace(/[^a-z0-9]+/gi,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('status').textContent='Employee signature HTML downloaded.'});render();
</script></body></html>
